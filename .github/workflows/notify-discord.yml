name: Notify Discord on new candidates

on:
  push:
    branches: [main]
    paths:
      - 'ideas/**/candidates*.md'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect newest candidates file from this push
        id: detect
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^ HEAD | grep -E '^ideas/.+/candidates.*\.md$' || true)
          if [ -z "$changed" ]; then
            echo "no_change=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(echo "$changed" | sort -V | tail -1)
          echo "file=$newest" >> "$GITHUB_OUTPUT"
          week=$(echo "$newest" | sed -E 's|^ideas/([0-9]+)/W([0-9]+)/.*|\1-W\2|')
          echo "week=$week" >> "$GITHUB_OUTPUT"
          python3 - "$newest" "${{ github.repository }}" <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, sys
          from urllib.parse import quote
          path = sys.argv[1]
          repo = sys.argv[2]
          fname = os.path.basename(path)
          m_batch = re.match(r"candidates(?:-(\d+))?\.md$", fname)
          batch = int(m_batch.group(1)) if m_batch and m_batch.group(1) else 1
          m_week = re.search(r"ideas/(\d{4})/W(\d{1,2})/", path)
          year = m_week.group(1) if m_week else ""
          week = m_week.group(2).zfill(2) if m_week else ""
          with open(path, encoding="utf-8") as f:
              text = f.read()
          blocks = re.split(r"^---\s*$", text, flags=re.M)
          items = []
          for b in blocks:
              m_title = re.search(r"^## (\d+)\.\s+(.+?)\s*$", b, flags=re.M)
              if not m_title:
                  continue
              num, title = m_title.group(1), m_title.group(2).strip()
              cat = re.search(r"^-\s*カテゴリ:\s*(.+?)\s*$", b, flags=re.M)
              line = re.search(r"^-\s*一行で:\s*(.+?)\s*$", b, flags=re.M)
              user = re.search(r"^-\s*対象ユーザー:\s*(.+?)\s*$", b, flags=re.M)
              pain = re.search(r"^###\s*解決する痛み\s*\n(.+?)(?=\n###|\n---|\Z)", b, flags=re.M | re.DOTALL)
              cat_s = cat.group(1).strip() if cat else ""
              line_s = line.group(1).strip() if line else ""
              user_s = user.group(1).strip() if user else ""
              pain_s = re.sub(r"\s+", " ", pain.group(1)).strip() if pain else ""
              if len(pain_s) > 220:
                  pain_s = pain_s[:217] + "..."
              issue_title = f"Select: {year}-W{week}-{batch}#{num} {title}"
              issue_body = (
                  f"From: `{path}` #{num}\n\n"
                  f"このまま Submit すると Actions が `selected.md` スタブを生成するのだ。\n"
              )
              select_url = (
                  f"https://github.com/{repo}/issues/new"
                  f"?labels=select"
                  f"&title={quote(issue_title)}"
                  f"&body={quote(issue_body)}"
              )
              header = f"**{num}. {title}**"
              meta = f"`{cat_s}` {line_s}".strip()
              who = f"対象: {user_s}" if user_s else ""
              detail = f"> {pain_s}" if pain_s else ""
              action = f":arrow_forward: [これを Select する]({select_url})"
              parts = [p for p in (header, meta, who, detail, action) if p]
              items.append("\n".join(parts))
          summary = "\n\n".join(items)
          print("summary<<SUMMARY_EOF")
          print(summary)
          print("SUMMARY_EOF")
          PY

      - name: Post to Discord webhook
        if: steps.detect.outputs.no_change != 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FILE: ${{ steps.detect.outputs.file }}
          WEEK: ${{ steps.detect.outputs.week }}
          SUMMARY: ${{ steps.detect.outputs.summary }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::secret DISCORD_WEBHOOK_URL is not set"
            exit 1
          fi
          URL="https://github.com/${REPO}/blob/main/${FILE}"
          MSG=$(printf ':sparkles: **lazy-product-lab %s** の 3 案できたのだ！\n\n%s\n\n<%s>\n\n気に入った案の :arrow_forward: 「Select」リンクをクリックして Submit するだけで深掘りが走るのだ。' "$WEEK" "$SUMMARY" "$URL")
          payload=$(jq -nc --arg c "$MSG" '{content: $c}')
          http=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data-raw "$payload" \
            "$WEBHOOK")
          echo "Discord HTTP $http"
          cat /tmp/resp.txt
          if [ "$http" != "204" ] && [ "$http" != "200" ]; then
            exit 1
          fi
