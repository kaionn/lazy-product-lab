name: Update idea index & stats

# 人間 / routine (PAT) の push で発火する。
# select-issue.yml / reject-issue.yml の GITHUB_TOKEN push はこの workflow を
# 発火しないため、それらは commit 前に scripts/update_index.py を自前実行する。
on:
  push:
    branches: [main]
    paths:
      - 'ideas/**'
      - 'poc/**'
      - 'scripts/update_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate INDEX.md / STATS.md
        run: python3 scripts/update_index.py

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- INDEX.md STATS.md; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.md STATS.md
          git commit -m "chore: INDEX.md / STATS.md を自動更新"
          git push origin HEAD:main
