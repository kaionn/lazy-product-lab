name: Auto-merge candidates to main

# CCR routine はサンドボックス上の作業ブランチ (claude/**) にコミットする。
# main への直 push は auto-mode classifier に阻まれるため、
# この workflow が candidates ブランチの push を検知して main へ自動マージする。
# 責務分離: 生成=CCR / 反映=GHA / 通知=notify-discord.yml (push event 経由)

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: auto-merge-candidates-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge candidates branch into main
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          MSG=$(git log -1 --format=%s "origin/$BRANCH")
          echo "branch=$BRANCH / head commit: $MSG"

          # candidates コミットだけを対象にする
          if ! echo "$MSG" | grep -qE '^candidates:.*案を追加'; then
            echo "candidates コミットではないためスキップ"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor HEAD "origin/$BRANCH"; then
            git merge --ff-only "origin/$BRANCH"
          else
            # ファイル名の競合時は theirs を優先（同週の別回生成）
            git merge -X theirs --no-edit "origin/$BRANCH"
          fi

          git push origin main

          # マージ完了後にブランチを削除
          git push origin --delete "$BRANCH" || true
